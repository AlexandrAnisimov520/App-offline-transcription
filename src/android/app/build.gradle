import java.security.MessageDigest
import java.nio.file.Files
import java.nio.file.StandardCopyOption

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def sherpaAar = file('libs/sherpa-onnx-static-link-onnxruntime-2.0.1.aar')
def bundledQwenModel = file('src/main/assets/models/Qwen3-1.7B-Q4_K_M.gguf')
def bundleQwen = true
if (bundledQwenModel.isFile() && bundledQwenModel.length() > 1024L && bundledQwenModel.length() != 1282439264L) {
    throw new GradleException('Bundled Qwen GGUF has an unexpected size')
}


android {
    namespace 'com.bimvo.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.bimvo.app'
        minSdk 26
        targetSdk 34
        versionCode 6
        versionName '0.6-diarization-campp'
        buildConfigField 'boolean', 'BUNDLED_QWEN', bundleQwen.toString()
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// CPU-only local ONNX inference; models are bundled into the APK at build time.
dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.24.3'
    implementation project(':llm')
    implementation files(sherpaAar).builtBy('ensureOfflineModels')
    implementation 'org.jetbrains.kotlin:kotlin-stdlib:2.0.21'
}

android {
    androidResources { noCompress += ['onnx', 'gguf'] }
    // MergeNativeLibs sees dependency ABIs before the APK ABI filters are applied.
    packaging { jniLibs.excludes += ['lib/x86/**', 'lib/armeabi-v7a/**'] }
    buildFeatures { buildConfig true }
    defaultConfig {
        ndk { abiFilters 'arm64-v8a', 'x86_64' }
    }
}

