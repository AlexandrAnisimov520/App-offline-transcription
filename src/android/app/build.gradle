tasks.register('ensureOfflineModels') {
    description = 'Prepare offline ASR, language identification, VAD, and Sherpa-ONNX'
    doLast {
        File dir = file('src/main/assets/models')
        dir.mkdirs()
        offlineModelFiles.each { model ->
            File target = model.target ?: new File(dir, model.name)
            target.parentFile.mkdirs()
            def hashFile = { File source ->
                MessageDigest digest = MessageDigest.getInstance('SHA-256')
                source.withInputStream { stream ->
                    byte[] buf = new byte[65536]
                    int count
                    while ((count = stream.read(buf)) >= 0) {
                        if (count > 0) digest.update(buf, 0, count)
                    }
                }
                digest.digest().collect { String.format('%02x', it & 0xff) }.join()
            }
            def valid = { File source -> source.isFile() && source.length() >= model.min &&
                    (!model.sha || hashFile(source).equalsIgnoreCase(model.sha)) }
            if (!valid(target)) {
                File part = new File(target.parentFile, target.name + '.download')
                part.delete()
                logger.lifecycle("BIMVO: getting offline asset {} (first build only)", model.name)
                try {
                    def conn = new URL(model.url).openConnection()
                    conn.setConnectTimeout(20000)
                    conn.setReadTimeout(90000)
                    conn.setRequestProperty('User-Agent', 'BIMVO-Android-Offline-Build')
                    conn.getInputStream().withCloseable { source ->
                        part.withOutputStream { out ->
                            byte[] buf = new byte[65536]
                            int n
                            while ((n = source.read(buf)) >= 0) if (n > 0) out.write(buf, 0, n)
                        }
                    }
                    if (!valid(part)) throw new GradleException('Model SHA-256/length validation failed for ' + model.name)
                    Files.move(part.toPath(), target.toPath(), StandardCopyOption.REPLACE_EXISTING)
                } catch (Exception error) {
                    part.delete()
                    throw new GradleException('Offline model download failed for ' + model.name +
                            '. Recheck the connection or stage the verified file manually.', error)
                }
            }
        }
    }
}

tasks.configureEach { task ->
    if (task.name == 'preBuild' || (task.name.startsWith('merge') && task.name.endsWith('Assets'))) {
        task.dependsOn(tasks.named('ensureOfflineModels'))
    }
}


android { kotlinOptions { jvmTarget = "17" } }
